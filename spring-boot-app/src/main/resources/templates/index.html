<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Spring Boot CI/CD Demo</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<nav class="navbar navbar-expand-md navbar-dark bg-dark">
    <a class="navbar-brand" th:href="@{/}">Spring Boot Delivery Demo</a>
</nav>
<main class="container py-5" id="main-content">
    <section class="starter-template" aria-labelledby="page-title">
        <h1 id="page-title" th:text="${title}">Spring Boot application</h1>
        <p th:text="${msg}">Deployed through an automated delivery pipeline.</p>
        <p class="text-muted">Application health: <a th:href="@{/healthz}">check status</a></p>
    </section>
</main>
</body>
</html>
